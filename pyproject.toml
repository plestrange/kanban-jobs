[project]
name = "job-pipeline"
version = "0.1.0"
description = "Core library and browser app for tracking a job search pipeline."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "flask>=3.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=1.19",
    "types-PyYAML",
    "sphinx>=7.4",
    "myst-parser>=3.0",
    "furo>=2025.12",
    "sphinx-autobuild>=2024.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["src", "app"]
ignore_missing_imports = true
disallow_untyped_defs = false
