<style id="app-style">
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}

:root{

}
@media (prefers-color-scheme:dark){

    --ink:#E7ECE9;
    --ink-2:#A2AEAB;
    --ink-3:#78837F;
    --line:#28302E;
    --line-2:#3A4340;
    --accent:#5EB5A7;
    --accent-soft:#17322E;
    --signal:#D4924F;
    --signal-soft:#332416;
    --good:#6CBE91;
    --good-soft:#16301F;
    --dim:#8C9895;
    --dim-soft:#212826;

}
:root[data-theme="dark"]{
  --ground:#0F1413;
  --surface:#161C1B;
  --surface-2:#1D2422;
  --ink:#E7ECE9;
  --ink-2:#A2AEAB;
  --ink-3:#78837F;
  --line:#28302E;
  --line-2:#3A4340;
  --accent:#5EB5A7;
  --accent-soft:#17322E;

  --signal-soft:#332416;

body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
}
#app{max-width:1140px;margin:0 auto;padding:28px 20px 72px}

.masthead{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.masthead h1{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.masthead .sub{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.stamp{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

.counters{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.counter{padding:8px 14px;border-right:1px solid var(--line);min-width:74px}
.counter:last-child{border-right:0}
.counter b{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.counter span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.toolbar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;margin:22px 0 6px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.field{display:flex;flex-direction:column;gap:5px}
.field > label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
select,.notes{background:var(--surface);border:1px solid var(--line-2);border-radius:3px;padding:6px 9px;color:var(--ink)}
select{min-width:150px}
.toolbar .spacer{flex:1 1 auto}

.savebar{display:flex;align-items:center;gap:12px}
.btn{font-family:Archivo,system-ui,sans-serif;font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0F1413}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.savenote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.savenote.dirty{color:var(--signal)}

.tier{margin-top:34px}
.tier-head{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.tier-head h2{font-family:Archivo,system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0}
.tier-head p{margin:0;color:var(--ink-3);font-size:13px;flex:1 1 220px}
.tier-count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rows{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:8px 22px;padding:16px 4px 16px 14px;border-bottom:1px solid var(--line);position:relative}
.row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--rail,transparent)}
.row.t-strong{--rail:var(--good)}
.row.t-good{--rail:var(--accent)}
.row.t-stretch{--rail:var(--signal)}
.row.t-out{--rail:var(--dim)}
.row.is-done{opacity:.55}

.rowhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.co{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}
.ti{font-size:15px;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 7px;border-radius:2px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.comp{background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.chip.track{background:transparent;border:1px solid var(--line-2);color:var(--ink-3)}
.chip.flag{background:var(--signal-soft);color:var(--signal)}
.why{margin:9px 0 0;max-width:70ch}
.why b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-right:6px}
.gap{margin:5px 0 0;max-width:70ch;color:var(--ink-2);font-size:14px}
.gap b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-right:6px}

.rowside{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.rowside select{width:100%;min-width:0;font-size:13.5px}
.applylink{font-family:Archivo,sans-serif;font-weight:600;font-size:13px;text-align:center;padding:7px 10px;border:1px solid var(--line-2);border-radius:3px;color:var(--accent);text-decoration:none}
.applylink:hover{border-color:var(--accent);background:var(--accent-soft)}
.notes{width:100%;min-height:46px;resize:vertical;font-size:13.5px;line-height:1.4}
.notes::placeholder{color:var(--ink-3)}

.status-applied,.status-screening,.status-interview,.status-offer{border-color:var(--accent)}
.status-passed,.status-rejected{border-color:var(--line)}

.empty{padding:22px 14px;color:var(--ink-3);font-style:italic}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;max-width:76ch}
.foot p{margin:0 0 8px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr)}
  .rowside{flex-direction:row;flex-wrap:wrap}
  .rowside select{flex:1 1 150px}
  .notes{flex:1 1 100%}
}
</style>

var STATE = JSON.parse(document.getElementById("app-state").textContent);
if(!STATE.status) STATE.status = {};
if(!STATE.notes) STATE.notes = {};
var DIRTY = false;
var FILTERS = {tier:"all",track:"all",loc:"all",status:"open"};

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function statusOf(id){return STATE.status[id] || "new";}
function locBucket(j){
  if(j.loc.indexOf("Remote") === 0) return "remote";
  if(j.loc.indexOf("Seattle") === 0) return "seattle";
  return "other";
}
function passes(j){
  if(FILTERS.tier !== "all" && j.tier !== FILTERS.tier) return false;
  if(FILTERS.track !== "all" && j.track !== FILTERS.track) return false;
  if(FILTERS.loc !== "all" && locBucket(j) !== FILTERS.loc) return false;
  var st = statusOf(j.id);
  if(FILTERS.status === "open" && DONE[st]) return false;
  if(FILTERS.status === "active" && (st === "new" || DONE[st])) return false;
  if(FILTERS.status === "done" && !DONE[st]) return false;
  return true;
}

function renderRow(j){
  var st = statusOf(j.id);
  var opts = "";
  for(var i=0;i<STATUSES.length;i++){
    opts += '<option value="' + STATUSES[i][0] + '"' + (STATUSES[i][0] === st ? " selected" : "") + ">" + esc(STATUSES[i][1]) + "</option>";
  }
  var chips = '<span class="chip track">' + esc(j.track) + '</span><span class="chip">' + esc(j.loc) + '</span><span class="chip comp">' + esc(j.comp) + "</span>";
  if(j.flag) chips += '<span class="chip flag">' + esc(j.flag) + "</span>";
  var link = j.url ? '<a class="applylink" href="' + esc(j.url) + '" target="_blank" rel="noopener">Open posting</a>' : "";
  return '<article class="row t-' + j.tier + (DONE[st] ? " is-done" : "") + '">' +
    '<div class="rowmain">' +
      '<div class="rowhead"><span class="co">' + esc(j.co) + '</span><span class="ti">' + esc(j.ti) + "</span></div>" +
      '<div class="meta">' + chips + "</div>" +
      '<p class="why"><b>Why</b>' + esc(j.why) + "</p>" +
      '<p class="gap"><b>Watch</b>' + esc(j.gap) + "</p>" +
    "</div>" +
    '<div class="rowside">' +
      '<select class="status-' + st + '" data-status="' + j.id + '" aria-label="Status for ' + esc(j.co) + '">' + opts + "</select>" +
      link +
      '<textarea class="notes" data-note="' + j.id + '" placeholder="Notes, contacts, dates" aria-label="Notes for ' + esc(j.co) + '">' + esc(STATE.notes[j.id] || "") + "</textarea>" +
    "</div>" +
  "</article>";
}

function renderApp(){
  var i, j;
  var counts = {total:0, active:0, applied:0, out:0};
  for(i=0;i<JOBS.length;i++){
    j = JOBS[i];
    if(j.tier === "out"){ counts.out++; continue; }
    counts.total++;
    var st = statusOf(j.id);
    if(!DONE[st] && st !== "new") counts.active++;
    if(st === "applied" || st === "screening" || st === "interview" || st === "offer") counts.applied++;
  }

  var tracks = {}, tOpts = '<option value="all">All tracks</option>';
  for(i=0;i<JOBS.length;i++){ tracks[JOBS[i].track] = 1; }
  for(var k in tracks){ if(tracks.hasOwnProperty(k)) tOpts += '<option value="' + esc(k) + '"' + (FILTERS.track === k ? " selected" : "") + ">" + esc(k) + "</option>"; }

  function sel(name, pairs, cur){
    var s = "";
    for(var a=0;a<pairs.length;a++){ s += '<option value="' + pairs[a][0] + '"' + (cur === pairs[a][0] ? " selected" : "") + ">" + esc(pairs[a][1]) + "</option>"; }
    return '<select data-filter="' + name + '">' + s + "</select>";
  }

  var html = "";
  html += '<header class="masthead">' +
    "<div><h1>Role Pipeline</h1>" +
    '<p class="sub">Data Science, MLOps and ML Engineering roles screened against your resume — remote-US or Seattle hybrid, ranked by how much of the posting you already do. Excluded: Amazon, Meta, crypto, gambling, law enforcement and defense, and roles built around an on-call rotation.</p>' +
    '<p class="stamp">Screened 6 September 2026 · ' + counts.total + " tracked · " + counts.out + " screened out</p></div>" +
    '<div class="counters">' +
      '<div class="counter"><b>' + counts.total + "</b><span>Tracked</span></div>" +
      '<div class="counter"><b>' + counts.active + "</b><span>In play</span></div>" +
      '<div class="counter"><b>' + counts.applied + "</b><span>Applied+</span></div>" +
    "</div></header>";

  html += '<div class="toolbar">' +
    '<div class="field"><label>Tier</label>' + sel("tier", [["all","All tiers"],["strong","Strong fit"],["good","Good fit"],["out","Screened out"]], FILTERS.tier) + "</div>" +
    '<div class="field"><label>Track</label><select data-filter="track">' + tOpts + "</select></div>" +
    '<div class="field"><label>Location</label>' + sel("loc", [["all","Anywhere"],["remote","Remote"],["seattle","Seattle"],["other","Other"]], FILTERS.loc) + "</div>" +
    '<div class="field"><label>Status</label>' + sel("status", [["open","Open (hide closed)"],["all","Everything"],["active","In play only"],["done","Closed only"]], FILTERS.status) + "</div>" +
    '<div class="spacer"></div>' +
    '<div class="savebar"><button class="btn" data-act="save"' + (DIRTY ? "" : " disabled") + ">Save changes</button>" +
    '<span class="savenote' + (DIRTY ? " dirty" : "") + '">' + (DIRTY ? "Unsaved edits" : (STATE.saved ? "Saved " + esc(STATE.saved) : "No edits yet")) + "</span></div>" +
  "</div>";

  for(var t=0;t<TIERS.length;t++){
    var tier = TIERS[t];
    var rows = "";
    var n = 0;
    for(i=0;i<JOBS.length;i++){
      j = JOBS[i];
      if(j.tier !== tier[0]) continue;
      if(!passes(j)) continue;
      rows += renderRow(j);
      n++;
    }
    if(FILTERS.tier !== "all" && FILTERS.tier !== tier[0]) continue;
    html += '<section class="tier"><div class="tier-head"><h2>' + esc(tier[1]) + "</h2><p>" + esc(tier[2]) + '</p><span class="tier-count">' + n + "</span></div>" +
      '<div class="rows">' + (n ? rows : '<p class="empty">Nothing here under the current filters.</p>') + "</div></section>";
  }

  html += '<footer class="foot">' +
    "<p>Comp figures are the ranges the employers posted, not offers. Ranges are the single most useful filter here and roughly half of Seattle postings publish one — treat an unposted range as a question for the recruiter screen, not as a gap.</p>" +
    "<p>Tiers weigh three things: how much of the posting describes work you have already shipped, whether the level matches Lead, and whether the location clears remote-US or Seattle-hybrid. Roles where the technical content was a genuine reach — GPU serving, distributed training, cluster infrastructure — were dropped rather than ranked, so everything listed is a role worth your time this week. Screened-out entries failed a location filter and are kept so they don't resurface in the next search.</p>" +
    "<p>The one pattern worth acting on: every role that fell out did so on the same axis — Kubernetes, GPU clusters, distributed training. That gap is what separates this list from the $250k+ band.</p>" +
    "<p>Status and notes save into this page itself, so the link stays current wherever you open it.</p>" +
  "</footer>";

  return html;
}

function paint(){
  document.getElementById("app").innerHTML = renderApp();
}

function markDirty(){
  if(!DIRTY){
    DIRTY = true;
    var b = document.querySelector('[data-act="save"]');
    var n = document.querySelector(".savenote");
    if(b) b.disabled = false;
    if(n){ n.textContent = "Unsaved edits"; n.classList.add("dirty"); }
  }
}

function buildDoc(){
  var style = document.getElementById("app-style").textContent;
  var code = document.getElementById("app-code").textContent;
  var json = JSON.stringify(STATE).replace(/</g, "\\u003c");
  return "<!doctype html>\n<html lang=\"en\">\n<head>\n" +
    "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
    "<title>" + DOC_TITLE + "</title>\n" +
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
    "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
    "<link id=\"app-fonts\" rel=\"stylesheet\" href=\"" + FONT_HREF + "\">\n" +
    "<style id=\"app-style\">" + style + "</style>\n</head>\n<body>\n" +
    "<div id=\"app\">" + renderApp() + "</div>\n" +
    "<script id=\"app-state\" type=\"application/json\">" + json + "<\/script>\n" +
    "<script id=\"app-code\">" + code + "<\/script>\n</body>\n</html>";
}

var ARTIFACT = null;
claude.use("artifact").then(function(a){ ARTIFACT = a; }).catch(function(){ ARTIFACT = null; });

function save(){
  var note = document.querySelector(".savenote");
  if(!ARTIFACT){
    if(note){ note.textContent = "Saving unavailable in this view"; }
    return;
  }
  if(note){ note.textContent = "Saving..."; }
  STATE.saved = new Date().toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
  ARTIFACT.publish(buildDoc()).then(function(){
    DIRTY = false;
  }).catch(function(err){
    var code = err && err.code;
    if(code === "conflict") return;
    if(note){
      note.textContent = (code === "not_writer" || code === "not_granted") ? "This view is read-only" : "Save failed — try again";
    }
  });
}

document.addEventListener("change", function(e){
  var el = e.target;
  if(el.dataset && el.dataset.filter){
    FILTERS[el.dataset.filter] = el.value;
    paint();
    return;
  }
  if(el.dataset && el.dataset.status){
    STATE.status[el.dataset.status] = el.value;
    markDirty();
    paint();
    return;
  }
  if(el.dataset && el.dataset.note){
    STATE.notes[el.dataset.note] = el.value;
    markDirty();
  }
});

document.addEventListener("input", function(e){
  if(e.target.dataset && e.target.dataset.note){
    STATE.notes[e.target.dataset.note] = e.target.value;
    markDirty();
  }
});

document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest('[data-act="save"]') : null;
  if(b) save();
});

paint();
</script>
